name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q ./*.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Restore keystore
        uses: actions/cache@v4
        with:
          path: project/debug.keystore
          key: debug-keystore-v1

      - name: Create keystore if missing
        working-directory: project
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "SHA1:" >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey | grep "SHA1" >> $GITHUB_STEP_SUMMARY

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: flappy-sky-apk
          path: project/app/build/outputs/apk/debug/*.apk
